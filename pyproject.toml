[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "v2p2r-mapreg"
version = "0.2.0"
description = "Conditional coupling fields for linked single-cell assays"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy==2.0.2",
  "scipy==1.13.1",
]

[tool.setuptools]
packages = ["mapreg", "scripts"]

[tool.ruff.lint.per-file-ignores]
"experiments/development/materialize_cumulant_sciplex.py" = ["E402"]
